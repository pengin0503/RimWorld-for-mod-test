name: Private Linux C metadata audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-linux-c-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify checkout and build scanner without cloud credentials
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet build experiments/c-reference-audit -c Release -o "$RUNNER_TEMP/c-reference-audit"
          python -m pip install -r requirements-r2-sdk.txt
          echo "PRIVATE_ROOT=$RUNNER_TEMP/rwmt-private" >> "$GITHUB_ENV"
      - name: Prepare fixed private inputs
        id: prepare
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          AWS_DEFAULT_REGION: auto
          RWMT_R2_TRANSPORT: sdk
        run: |
          python -m tools.private_static_audit prepare --private-root "$PRIVATE_ROOT" > "$RUNNER_TEMP/private-c-prepare.log" 2>&1 || { echo 'Private input preparation failed'; exit 1; }
      - name: Scan metadata without cloud credentials
        id: scan
        if: steps.prepare.outcome == 'success'
        run: |
          python -m tools.private_static_audit scan --private-root "$PRIVATE_ROOT" --scanner "$RUNNER_TEMP/c-reference-audit/CReferenceAudit.dll" > "$RUNNER_TEMP/private-c-scan.log" 2>&1 || { echo 'Private metadata scan did not complete'; exit 1; }
      - name: Publish revalidated fixed fields
        if: always() && env.PRIVATE_ROOT != ''
        run: python -m tools.private_static_audit publish --private-root "$PRIVATE_ROOT"
