name: Private Rimworld-Statistics qualified A+B game smoke

on:
  # Public, credential-free PR preflight; secrets are NEVER available to this job.
  pull_request:
    paths:
      - '.github/workflows/private-statistics-smoke.yml'
  # A merge of this reviewed workflow activates the qualified real-game gate
  # exactly once; other main commits do not consume private R2 bandwidth.
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-statistics-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwmt-statistics-a-smoke
  cancel-in-progress: false

jobs:
  # This job runs on PRs without R2 credentials and validates the exact
  # pinned Statistics sources before a reviewer can integrate the private gate.
  source-build-preflight:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pengin0503/Rimworld-Statistics
          ref: 90b86b85ddb0682bd9f755bad4afc3bc3026954f
          path: statistics-src
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify immutable Statistics source pin and workflow signature
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C statistics-src rev-parse HEAD)" = '90b86b85ddb0682bd9f755bad4afc3bc3026954f'
          grep -Fq 'class GoToMainMenuPatch' statistics-src/Source/RimworldStatistics/Patches/GoToMainMenuPatch.cs
          grep -Fq 'class MainMenuButtonPatch' statistics-src/Source/RimworldStatistics/Patches/MainMenuButtonPatch.cs
      - name: Compile current Statistics production MOD using public reference assemblies
        shell: bash
        run: |
          set -euo pipefail
          dotnet build statistics-src/Source/RimworldStatistics/RimworldStatistics.csproj -c Release --nologo -p:UseNuGetRefs=true
          test -f statistics-src/1.7/Assemblies/RimworldStatistics.dll
          test -f statistics-src/1.7/Assemblies/RimworldStatistics.Core.dll
          test -f statistics-src/1.7/Assemblies/RimworldStatistics.Api.dll
      - name: Run current Statistics Core regression tests (private originals intentionally absent)
        shell: bash
        run: |
          set -euo pipefail
          cd statistics-src
          # xUnit v3 requires global.json's Microsoft.Testing.Platform runner.
          dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true
      - name: Compile host Worker without any game binaries or credentials
        run: dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin --nologo

  statistics-a-smoke:
    needs: source-build-preflight
    if: github.repository == 'pengin0503/RimWorld-for-mod-test' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_ROOT: /tmp/rwmt-statistics-private-${{ github.run_id }}
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pengin0503/Rimworld-Statistics
          ref: 90b86b85ddb0682bd9f755bad4afc3bc3026954f
          path: statistics-src
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify pinned Statistics source and current RWMT branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C statistics-src rev-parse HEAD)" = '90b86b85ddb0682bd9f755bad4afc3bc3026954f'
      - name: Build Statistics mod from pinned public sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          cd statistics-src
          dotnet build Source/RimworldStatistics/RimworldStatistics.csproj -c Release --nologo -p:UseNuGetRefs=true > "$RUNNER_TEMP/stats-build.log" 2>&1 || {
            echo 'Statistics source build failed'
            exit 1
          }
          test -f 1.7/Assemblies/RimworldStatistics.dll
          test -f 1.7/Assemblies/RimworldStatistics.Core.dll
          test -f 1.7/Assemblies/RimworldStatistics.Api.dll
      - name: Build RWMT Worker without credentials
        shell: bash
        run: |
          set -euo pipefail
          dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin > "$RUNNER_TEMP/rwmt-worker-build.log" 2>&1 || {
            echo 'RWMT worker build failed'
            exit 1
          }
      - name: Install pinned private asset SDK
        run: python -m pip install -r requirements-r2-sdk.txt > "$RUNNER_TEMP/r2-sdk-install.log" 2>&1
      - name: Prepare private real game and Harmony from read-only R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          AWS_DEFAULT_REGION: auto
          RWMT_R2_TRANSPORT: sdk
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$R2_ENDPOINT"
          python tools/codex_workflow.py prepare --private-root "$PRIVATE_ROOT" > "$RUNNER_TEMP/private-prepare.log" 2>&1 || {
            echo 'Private game preparation failed; no raw logs are exposed'
            exit 1
          }
          python tools/codex_workflow.py fetch-mods \
            --private-root "$PRIVATE_ROOT" \
            --local-target "$GITHUB_WORKSPACE/statistics-src" \
            --dependency Harmony \
            --official Core Royalty Ideology Biotech Odyssey \
            --scope validation \
            --language English > "$RUNNER_TEMP/private-mods.log" 2>&1 || {
            echo 'Private Harmony/mod preparation failed; no raw logs are exposed'
            exit 1
          }
      - name: Run A-level actual-game load and compare with without Statistics
        shell: bash
        run: |
          set -euo pipefail
          # This step intentionally has NO AWS / R2 credentials.
          test -z "${AWS_ACCESS_KEY_ID:-}" && test -z "${AWS_SECRET_ACCESS_KEY:-}"
          python tools/codex_workflow.py validate --private-root "$PRIVATE_ROOT" \
            --worker worker/bin --run-id statistics-a-smoke > "$RUNNER_TEMP/statistics-smoke.log" 2>&1 || {
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["PRIVATE_ROOT"])/"results"/"statistics-a-smoke"/"result.json"
          if p.is_file():
              r=json.loads(p.read_text())
              print(json.dumps({"status":r.get("status"),"stageA":r.get("stages",{}).get("A"),"reasons":[x.get("code") for x in r.get("reasons",[])]}))
          else:
              print("A-level smoke did not produce a result")
          PY
            exit 1
          }
      - name: Print fixed safe validation summary only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["PRIVATE_ROOT"])/"results"/"statistics-a-smoke"/"result.json"
          r=json.loads(p.read_text())
          summary={"status":r.get("status"),"fidelity":r.get("fidelity"),
                   "stageA":r.get("stages",{}).get("A"),
                   "reasons":[x.get("code") for x in r.get("reasons",[])],
                   "newErrorCount":len(r.get("diagnostics",{}).get("newInTarget",[]))}
          print(json.dumps(summary,sort_keys=True))
          if r.get("status")!="passed" or r.get("fidelity")!="qualified":
              raise SystemExit("A-level qualified acceptance criterion not met")
          PY
      - name: Construct pinned Harmony B-level expectations (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["PRIVATE_ROOT"])
          src=json.loads((root/"request.json").read_text())
          src["levels"]=["A","B"]
          src["expectations"]={"harmonyPatches":[
              {"owner":"pengin0503.rimworldstatistics",
               "targetAssembly":"Assembly-CSharp","targetType":"Verse.GenScene",
               "targetMethod":"GoToMainMenu","targetParameters":[],
               "kind":"prefix","patchType":"RimworldStatistics.Patches.GoToMainMenuPatch",
               "patchMethod":"Prefix"},
              {"owner":"pengin0503.rimworldstatistics",
               "targetAssembly":"Assembly-CSharp","targetType":"Verse.OptionListingUtility",
               "targetMethod":"DrawOptionListing",
               "targetParameters":["UnityEngine.Rect","System.Collections.Generic.List`1[Verse.ListableOption]"],
               "kind":"prefix","patchType":"RimworldStatistics.Patches.MainMenuButtonPatch",
               "patchMethod":"Prefix"}
          ]}
          dest=root/"statistics-b-request.json"
          dest.write_text(json.dumps(src,sort_keys=True),encoding="utf-8")
          dest.chmod(0o600)
          print("B-level contract created: 2 statically audited Harmony prefixes")
          PY
      - name: Run B-level actual-game Harmony registration checks
        shell: bash
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}" && test -z "${AWS_SECRET_ACCESS_KEY:-}"
          python tools/codex_workflow.py validate --private-root "$PRIVATE_ROOT" \
            --request "$PRIVATE_ROOT/statistics-b-request.json" \
            --worker worker/bin --run-id statistics-b-smoke > "$RUNNER_TEMP/statistics-b-smoke.log" 2>&1 || {
            echo 'B-level real-game validation did not pass; raw diagnostics are not published'
            exit 1
          }
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["PRIVATE_ROOT"])/"results"/"statistics-b-smoke"/"result.json"
          r=json.loads(p.read_text())
          b=r.get("stages",{}).get("B")
          print(json.dumps({"status":r.get("status"),"fidelity":r.get("fidelity"),
                            "stageB":b,"reasons":[x.get("code") for x in r.get("reasons",[])]},
                           ensure_ascii=False,sort_keys=True))
          if r.get("status")!="passed" or r.get("fidelity")!="qualified" or \
              not isinstance(b,dict) or b.get("status")!="completed":
              raise SystemExit("Qualified B-level patch registration gate not met")
          PY
