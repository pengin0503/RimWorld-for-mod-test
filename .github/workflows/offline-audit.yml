name: Offline input audit

on:
  push:
    branches: [main, docs/headless-design-review, claude/project-thread-poug58]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python syntax
        run: python -m compileall -q tools tests experiments
      - name: Install optional R2 SDK for synthetic coverage
        run: python -m pip install -r requirements-r2-sdk.txt
      - name: Test R2 SDK bounds with synthetic responses
        run: python -m unittest tests.test_r2_sdk -v
      - name: Test synthetic inputs only
        run: python -m unittest discover -s tests -v

  # The GUI's game-independent part. The GUI itself references the game's DLLs
  # and is built only where the game is installed (never here).
  gui-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test the GUI model (warnings are errors)
        run: dotnet test gui/RimWorldValidation.Gui.Model.Tests -c Release

  # Builds the validation Worker without any game file: it binds every game
  # member by reflection at run time. Real-game runs stay private.
  worker-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Worker (warnings are errors)
        run: dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin
      - name: Bound category traversal before game predicates (synthetic only)
        run: dotnet run --project tests/worker/CategoryTree -c Release
      - name: Bounded tick execution (synthetic only)
        run: dotnet run --project tests/worker/BoundedTick -c Release
      - name: Private C metadata scanner (synthetic only)
        run: dotnet run --project tests/worker/CReferenceAudit -c Release
      - name: Verified C dialog constructor binding (synthetic only)
        run: dotnet run --project tests/worker/CContextBinding -c Release
      - name: Windows build has the apphost the Controller starts
        if: runner.os == 'Windows'
        shell: bash
        run: test -f worker/bin/RimWorldValidationWorker.exe
      - name: Worker refuses to run without a Controller request
        shell: bash
        run: |
          set +e
          dotnet worker/bin/RimWorldValidationWorker.dll
          code=$?
          test "$code" -eq 2
