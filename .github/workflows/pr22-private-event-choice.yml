name: Private event-choice Linux regression (temporary)

on:
  push:
    branches: [ci/pr22-real-game-20261027]

permissions:
  contents: read

jobs:
  event-choice-real-game:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate configured read-only R2 connection
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "R2 access key is unavailable"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "R2 secret is unavailable"; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "R2 endpoint variable is unavailable"; exit 1; }
          command -v aws >/dev/null || { echo "AWS CLI unavailable"; exit 1; }
          echo "Private R2 prerequisites present"

      - name: Download only the Linux runtime selection into ephemeral private storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rwmt-private"
          python3 tools/codex_workflow.py prepare --private-root "$RUNNER_TEMP/rwmt-private" > "$RUNNER_TEMP/rwmt-prepare.log" 2>&1 || {
            echo "Private game preparation failed; raw private logs are intentionally not uploaded"
            exit 1
          }
          test -f "$RUNNER_TEMP/rwmt-private/game-snapshot/snapshot.json" || test -d "$RUNNER_TEMP/rwmt-private/game-snapshot"
          echo "Private Linux game snapshot prepared"

      - name: Build Worker
        shell: bash
        run: |
          set -euo pipefail
          dotnet build worker/RimWorldValidation.Worker -c Release -o "$RUNNER_TEMP/rwmt-worker" > "$RUNNER_TEMP/rwmt-worker-build.log" 2>&1 || {
            echo "Worker build failed; private logs are not uploaded"
            exit 1
          }
          echo "Worker built"

      - name: Execute self-made fixture without cloud credentials
        shell: bash
        run: |
          set -uo pipefail
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
              -u R2_ENDPOINT -u R2_BUCKET -u AWS_PROFILE -u AWS_DEFAULT_PROFILE \
              python3 tests/integration/run_event_choice.py \
                --snapshot "$RUNNER_TEMP/rwmt-private/game-snapshot" \
                --worker "$RUNNER_TEMP/rwmt-worker" \
                --out "$RUNNER_TEMP/rwmt-event-choice" > "$RUNNER_TEMP/rwmt-fixture.log" 2>&1
          rc=$?
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rwmt-event-choice/result/result.json'
          if not p.exists():
              print('Private fixture result missing (no game result is published)')
          else:
              x = json.loads(p.read_text(encoding='utf-8'))
              c = (x.get('stages') or {}).get('C') or {}
              rows = ((x.get('checks') or {}).get('eventChoices') or [])
              actual = ((rows[0] or {}).get('actual') or {}) if len(rows) == 1 else {}
              safe = {
                  'overall': x.get('status'), 'execution': x.get('executionStatus'),
                  'C': c.get('status'), 'fidelity': x.get('fidelity'),
                  'reasons': [r.get('code') for r in x.get('reasons', [])],
                  'map_delta_source': actual.get('rewardSource'),
                  'map_delta_unambiguous': actual.get('mapDeltaUnambiguous'),
                  'observed_item': actual.get('rewardThing'),
                  'observed_count': actual.get('rewardCount')
              }
              print('Sanitized event-choice summary: ' + json.dumps(safe, ensure_ascii=False))
          PY
          exit "$rc"
