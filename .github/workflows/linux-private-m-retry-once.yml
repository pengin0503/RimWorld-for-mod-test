name: Private Linux 1.7.4985 M-only index-corrected retry

# One-shot only: changing this exact file on main triggers the fixed M
# workload. Neither the S run nor the experimental D v2 acceptance is repeated.
# Remove after the sanitized result has been recorded.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-private-m-retry-once.yml'

permissions:
  contents: read

jobs:
  profile_m:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/linux-private-workload.yml
    with:
      profile: M
    secrets: inherit
