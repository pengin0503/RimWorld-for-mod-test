name: Private Linux validation regression

on:
  push:
    branches: [feat/linux-validation-efficiency-20261028]

permissions:
  contents: read

jobs:
  private-regression:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare one private runtime and index-resolved MOD inputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          AWS_DEFAULT_REGION: auto
        run: |
          python tests/integration/run_linux_regression.py prepare --root "$RUNNER_TEMP/rwmt-private" > "$RUNNER_TEMP/private-prepare.log" 2>&1 || { echo 'Private preparation failed; raw logs are not published'; exit 1; }
      - name: Build Worker
        run: dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin
      - name: Validate without cloud credentials
        run: |
          python tests/integration/run_linux_regression.py run --root "$RUNNER_TEMP/rwmt-private" > "$RUNNER_TEMP/private-regression.log" 2>&1 || { echo 'Private regression failed; inspect sanitized summary'; exit 1; }
      - name: Publish whitelisted summary only
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/rwmt-private/safe-summary.json"; then
            cat "$RUNNER_TEMP/rwmt-private/safe-summary.json"
          else
            echo 'No sanitized result; preparation or execution did not finish'
          fi
