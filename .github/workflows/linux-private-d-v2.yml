name: Private Linux D v2 experimental acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: private-linux-d-v2
  cancel-in-progress: false

jobs:
  finite-tick:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify pinned main source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install private R2 SDK
        run: python -m pip install -r requirements-r2-sdk.txt
      - name: Prepare private pinned Linux runtime
        id: prepare
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          RWMT_R2_TRANSPORT: sdk
        run: |
          python tools/codex_workflow.py prepare --private-root "$RUNNER_TEMP/rwmt-d-v2" > "$RUNNER_TEMP/rwmt-d-v2-prepare-private.log" 2>&1 || {
            echo "Private D v2 game preparation unavailable or incomplete"
            exit 2
          }
      - name: Build Worker without credentials
        if: steps.prepare.outcome == 'success'
        run: dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin
      - name: Test genuine v2 game.tick, mismatch, and cache reuse
        if: steps.prepare.outcome == 'success'
        run: |
          python tests/integration/run_bounded_tick_v2.py --snapshot "$RUNNER_TEMP/rwmt-d-v2/game-snapshot" --worker worker/bin --out "$RUNNER_TEMP/rwmt-d-v2-acceptance"
