name: Private Rimworld-Statistics A-level game loader smoke

on:
  push:
    branches: [ci/statistics-real-game-a-20261109]
    paths: ['.github/workflows/private-statistics-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwmt-statistics-a-smoke
  cancel-in-progress: false

jobs:
  statistics-a-smoke:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_ROOT: /tmp/rwmt-statistics-private-${{ github.run_id }}
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pengin0503/Rimworld-Statistics
          ref: 9e411dde8abc7e5f5f6ef6d1510835fb17788360
          path: statistics-src
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify pinned Statistics source and current RWMT branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C statistics-src rev-parse HEAD)" = '9e411dde8abc7e5f5f6ef6d1510835fb17788360'
      - name: Build Statistics mod from pinned public sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          cd statistics-src
          dotnet build Source/RimworldStatistics/RimworldStatistics.csproj -c Release --nologo -p:UseNuGetRefs=true > "$RUNNER_TEMP/stats-build.log" 2>&1 || {
            echo 'Statistics source build failed'
            exit 1
          }
          test -f 1.7/Assemblies/RimworldStatistics.dll
          test -f 1.7/Assemblies/RimworldStatistics.Core.dll
          test -f 1.7/Assemblies/RimworldStatistics.Api.dll
      - name: Build RWMT Worker without credentials
        shell: bash
        run: |
          set -euo pipefail
          dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin > "$RUNNER_TEMP/rwmt-worker-build.log" 2>&1 || {
            echo 'RWMT worker build failed'
            exit 1
          }
      - name: Install pinned private asset SDK
        run: python -m pip install -r requirements-r2-sdk.txt > "$RUNNER_TEMP/r2-sdk-install.log" 2>&1
      - name: Prepare private real game and Harmony from read-only R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          AWS_DEFAULT_REGION: auto
          RWMT_R2_TRANSPORT: sdk
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$R2_ENDPOINT"
          python tools/codex_workflow.py prepare --private-root "$PRIVATE_ROOT" > "$RUNNER_TEMP/private-prepare.log" 2>&1 || {
            echo 'Private game preparation failed; no raw logs are exposed'
            exit 1
          }
          python tools/codex_workflow.py fetch-mods \
            --private-root "$PRIVATE_ROOT" \
            --local-target "$GITHUB_WORKSPACE/statistics-src" \
            --dependency Harmony \
            --official Core Royalty Ideology Biotech Odyssey \
            --scope validation \
            --language English > "$RUNNER_TEMP/private-mods.log" 2>&1 || {
            echo 'Private Harmony/mod preparation failed; no raw logs are exposed'
            exit 1
          }
      - name: Run A-level actual-game load and compare with without Statistics
        shell: bash
        run: |
          set -euo pipefail
          # This step intentionally has NO AWS / R2 credentials.
          test -z "${AWS_ACCESS_KEY_ID:-}" && test -z "${AWS_SECRET_ACCESS_KEY:-}"
          python tools/codex_workflow.py validate --private-root "$PRIVATE_ROOT" \
            --worker worker/bin --run-id statistics-a-smoke > "$RUNNER_TEMP/statistics-smoke.log" 2>&1 || {
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["PRIVATE_ROOT"])/"results"/"statistics-a-smoke"/"result.json"
          if p.is_file():
              r=json.loads(p.read_text())
              print(json.dumps({"status":r.get("status"),"stageA":r.get("stages",{}).get("A"),"reasons":[x.get("code") for x in r.get("reasons",[])]}))
          else:
              print("A-level smoke did not produce a result")
          PY
            exit 1
          }
      - name: Print fixed safe validation summary only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["PRIVATE_ROOT"])/"results"/"statistics-a-smoke"/"result.json"
          r=json.loads(p.read_text())
          summary={"status":r.get("status"),"fidelity":r.get("fidelity"),
                   "stageA":r.get("stages",{}).get("A"),
                   "reasons":[x.get("code") for x in r.get("reasons",[])],
                   "newErrorCount":len(r.get("diagnostics",{}).get("newInTarget",[]))}
          print(json.dumps(summary,sort_keys=True))
          if r.get("status")!="passed" or r.get("fidelity")!="qualified":
              raise SystemExit("A-level qualified acceptance criterion not met")
          PY
