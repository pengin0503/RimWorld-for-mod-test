name: Private Linux bounded tick acceptance
on:
  push:
    branches: [feat/bounded-tick-v1-20261029]
    paths: ['tools/**', 'worker/**', 'tests/**', '.github/workflows/linux-private-bounded-tick.yml']
permissions:
  contents: read
jobs:
  bounded-tick:
    if: github.repository == 'pengin0503/RimWorld-for-mod-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-r2-sdk.txt
      - name: Prepare one private runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: rimworld-17
          AWS_DEFAULT_REGION: auto
          RWMT_R2_TRANSPORT: sdk
        run: |
          python tools/codex_workflow.py prepare --private-root "$RUNNER_TEMP/rwmt-private" > "$RUNNER_TEMP/private-prepare.log" 2>&1 || { echo 'Private preparation failed; raw logs are not published'; exit 1; }
      - name: Build Worker
        run: dotnet build worker/RimWorldValidation.Worker -c Release -o worker/bin
      - name: Finite tick acceptance without cloud credentials
        run: |
          python tests/integration/run_bounded_tick.py --snapshot "$RUNNER_TEMP/rwmt-private/game-snapshot" --out "$RUNNER_TEMP/rwmt-private/ticks" > "$RUNNER_TEMP/private-ticks.log" 2>&1 || { echo 'Finite tick acceptance failed; see sanitized summary'; exit 1; }
      - name: Existing C regressions on the same snapshot
        if: always()
        run: |
          python tests/integration/run_event_choice.py --snapshot "$RUNNER_TEMP/rwmt-private/game-snapshot" --out "$RUNNER_TEMP/rwmt-private/event" > "$RUNNER_TEMP/private-event.log" 2>&1 || { echo 'Event regression failed'; exit 1; }
          python tests/integration/run_bill_ingredients.py --snapshot "$RUNNER_TEMP/rwmt-private/game-snapshot" --out "$RUNNER_TEMP/rwmt-private/materials" > "$RUNNER_TEMP/private-materials.log" 2>&1 || { echo 'Material regression failed'; exit 1; }
      - name: Publish whitelisted summary only
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/rwmt-private/ticks/safe-summary.json"; then
            cat "$RUNNER_TEMP/rwmt-private/ticks/safe-summary.json"
          else
            echo 'No sanitized D result; preparation or build did not finish'
          fi
