name: Offline input audit

on:
  push:
    branches: [main, docs/headless-design-review]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python syntax
        run: python -m compileall -q tools tests
      - name: Test synthetic inputs only
        run: python -m unittest discover -s tests -v
